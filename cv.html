<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasbial Jamil M.P — Resume ATS</title>
  <meta name="description" content="Resume ATS Hasbial Jamil Mardia Putra — Fresh Graduate S1 Teknik Informatika">
  <link rel="stylesheet" href="css/cv.css">
  <style>
    .print-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      z-index: 999;
    }
    .btn-print {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-back {
      background: #222;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    @media print {
      .print-controls { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="print-controls">
    <button onclick="window.print()" class="btn-print">🖨️ Print / Save as PDF</button>
    <a href="index.html" class="btn-back">← Kembali</a>
  </div>

  <div class="cv-container">

    <header class="cv-header">
      <h1 id="cv-name">Hasbial Jamil Mardia Putra</h1>
      <p id="cv-contact" class="cv-contact-info"></p>
      <div id="cv-socials" class="cv-socials"></div>
    </header>

    <section class="cv-section">
      <h2 class="cv-section-title">Summary</h2>
      <div id="cv-summary"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Publikasi Ilmiah</h2>
      <div id="cv-publications"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Experience</h2>
      <div id="cv-experience"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Projects</h2>
      <div id="cv-projects"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Education</h2>
      <div id="cv-education"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Skills</h2>
      <div id="cv-skills"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Certifications &amp; Achievements</h2>
      <div id="cv-certificates"></div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section-title">Bahasa</h2>
      <div id="cv-languages"></div>
    </section>

  </div>

  <script src="js/data.js"></script>
  <script src="js/cv.js"></script>

</body>
</html>
